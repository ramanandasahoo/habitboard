<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F4F5">
<title>HabitBoard</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main class="screen">
  <header>
    <h1 id="greeting">Hello</h1>
    <p class="date" id="date"></p>
  </header>

  <section class="panel progress" aria-label="Daily progress">
    <div class="dial" id="dial" role="progressbar" aria-label="Today's completion"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <svg id="ticks" viewBox="0 0 140 140" aria-hidden="true"></svg>
      <div class="knob">
        <div class="mark"></div>
        <span class="pct" id="pct">0%</span>
      </div>
    </div>
    <div class="summary" aria-live="polite">
      <h2 class="label">Today</h2>
      <p class="big" id="summary"></p>
      <p class="meta" id="split"></p>
    </div>
  </section>

  <section class="panel" aria-labelledby="t-h">
    <div class="head">
      <h2 class="label" id="t-h">Today's tasks</h2>
      <span class="meta" id="t-count"></span>
    </div>
    <ul class="list" id="tasks"></ul>
  </section>

  <section class="panel" aria-labelledby="h-h">
    <div class="head">
      <h2 class="label" id="h-h">Daily habits</h2>
      <span class="meta" id="h-count"></span>
    </div>
    <ul class="list" id="habits"></ul>
  </section>

  <section class="panel" aria-labelledby="n-h">
    <h2 class="label" id="n-h">Daily note</h2>
    <textarea class="note" id="note" rows="3" aria-labelledby="n-h"
              placeholder="Write a plan or a thought for today"></textarea>
  </section>
</main>

<button class="add" id="add" type="button" aria-label="Add task">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
    <path d="M12 5v14M5 12h14"/>
  </svg>
</button>

<dialog id="dlg" aria-labelledby="d-h">
  <form id="form">
    <h2 class="label" id="d-h">New task</h2>
    <label class="field">Title
      <input id="t-title" required maxlength="80" autocomplete="off">
    </label>
    <label class="field">Priority
      <select id="t-prio">
        <option value="1">Low</option>
        <option value="2" selected>Medium</option>
        <option value="3">High</option>
      </select>
    </label>
    <div class="actions">
      <button class="btn" type="button" id="cancel">Cancel</button>
      <button class="btn" type="submit">Add task</button>
    </div>
  </form>
</dialog>

<script src="js/app.js"></script>
</body>
<
  /html>
